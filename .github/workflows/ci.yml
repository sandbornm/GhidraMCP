name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Python Linting & Type Checking
  # ===========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies (uv)
      run: uv pip install -e . -r requirements-dev.txt

    - name: Run ruff linter
      run: ruff check . --output-format=github

    - name: Run ruff formatter check
      run: ruff format --check .

    - name: Run mypy type checking
      run: mypy bridge_mcp_ghidra.py trajectory_recorder.py --ignore-missing-imports

  # ===========================================================================
  # Python Tests
  # ===========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies (uv)
      run: uv pip install -e . -r requirements-dev.txt

    - name: Run unit tests with coverage
      run: |
        python -m pytest tests/ -v \
          --cov=bridge_mcp_ghidra \
          --cov=trajectory_recorder \
          --cov-report=xml \
          --cov-report=term-missing \
          -m "not integration and not slow" \
          --timeout=30

    - name: Upload coverage report
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml

  # ===========================================================================
  # Integration Tests (requires Docker)
  # ===========================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies (uv)
      run: uv pip install -e . -r requirements-dev.txt

    - name: Run integration tests
      run: |
        python -m pytest tests/ -v -m "integration" --timeout=60

  # ===========================================================================
  # Java/Maven Build (Ghidra Plugin)
  # ===========================================================================
  build-java:
    name: Build Ghidra Plugin
    runs-on: ubuntu-latest
    env:
      GHIDRA_VERSION: 11.3.2
      GHIDRA_DATE: 20250415
      GHIDRA_LIBS: >-
        Features/Base/lib/Base.jar
        Features/Decompiler/lib/Decompiler.jar
        Framework/Docking/lib/Docking.jar
        Framework/Generic/lib/Generic.jar
        Framework/Project/lib/Project.jar
        Framework/SoftwareModeling/lib/SoftwareModeling.jar
        Framework/Utility/lib/Utility.jar
        Framework/Gui/lib/Gui.jar

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Download Ghidra
      run: |
        wget --no-verbose -O ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${{ env.GHIDRA_VERSION }}_build/ghidra_${{ env.GHIDRA_VERSION }}_PUBLIC_${{ env.GHIDRA_DATE }}.zip
        7z x -bd ghidra.zip

    - name: Copy Ghidra libs
      run: |
        mkdir -p ./lib
        for libfile in ${{ env.GHIDRA_LIBS }}
          do echo "Copying ${libfile} to lib/"
          cp ghidra_${{ env.GHIDRA_VERSION }}_PUBLIC/Ghidra/${libfile} ./lib/
        done

    - name: Build with Maven
      run: mvn clean package assembly:single

    - name: Assemble release directory
      run: |
        mkdir release
        cp target/GhidraMCP-*-SNAPSHOT.zip release/
        cp bridge_mcp_ghidra.py release/
        cp trajectory_recorder.py release/
        cp requirements.txt release/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GhidraMCP-artifact
        path: |
          release/*

  # ===========================================================================
  # Docker Build Test
  # ===========================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (test only)
      uses: docker/build-push-action@v5
      with:
        context: ./docker
        push: false
        tags: ghidra-mcp-gdb:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ===========================================================================
  # Docker Runtime Smoke Tests (new endpoints)
  # ===========================================================================
  docker-smoke:
    name: Docker Runtime Smoke Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
    - uses: actions/checkout@v4

    - name: Start analysis container
      run: docker compose -f docker/docker-compose.yml up -d --build

    - name: Wait for health
      run: |
        set -euo pipefail
        for i in $(seq 1 20); do
          if curl -sf "http://127.0.0.1:5000/health" > /tmp/health.json; then
            exit 0
          fi
          sleep 2
        done
        echo "Container did not become healthy in time"
        docker compose -f docker/docker-compose.yml logs
        exit 1

    - name: Verify new endpoint behavior (missing binary paths)
      run: |
        set -euo pipefail

        code_pe=$(curl -sS -o /tmp/pe_info.json -w "%{http_code}" \
          -X POST "http://127.0.0.1:5000/pe/info" \
          -H "Content-Type: application/json" \
          -d '{"binary":"definitely_missing.exe"}')
        test "$code_pe" = "404"

        code_angr=$(curl -sS -o /tmp/angr_entry.json -w "%{http_code}" \
          -X POST "http://127.0.0.1:5000/angr/entry" \
          -H "Content-Type: application/json" \
          -d '{"binary":"definitely_missing.bin"}')
        test "$code_angr" = "404"

    - name: Verify angr self-test runtime health
      run: |
        set -euo pipefail
        curl -sS -X POST "http://127.0.0.1:5000/angr/selftest" \
          -H "Content-Type: application/json" \
          -d '{"timeout":30}' > /tmp/angr_selftest.json
        python3 -c "import json; d=json.load(open('/tmp/angr_selftest.json')); assert d.get('ok') is True, d; assert d.get('found_states', 0) >= 1, d; print('angr selftest ok')"

    - name: Dump container logs on failure
      if: failure()
      run: docker compose -f docker/docker-compose.yml logs

    - name: Stop analysis container
      if: always()
      run: docker compose -f docker/docker-compose.yml down -v

  # ===========================================================================
  # Security Scan
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install dependencies (uv)
      run: uv pip install -e . -r requirements-dev.txt

    - name: Run ruff security rules
      run: ruff check . --select S --output-format=github || true

    - name: Check for secrets in code
      run: |
        # Basic check for common secret patterns
        if grep -rn "password\s*=\s*['\"]" --include="*.py" --exclude-dir=tests .; then
          echo "WARNING: Possible hardcoded passwords found"
        fi
        if grep -rn "api_key\s*=\s*['\"]" --include="*.py" --exclude-dir=tests .; then
          echo "WARNING: Possible hardcoded API keys found"
        fi

  # ===========================================================================
  # Merge Gate - All checks must pass before merge
  # Add "Merge Gate" as required status check in branch protection
  # ===========================================================================
  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs: [lint, test, integration-test, build-java, docker-build, docker-smoke, security]
    if: github.event_name == 'pull_request'
    steps:
    - run: echo "All checks passed - ready to merge"
